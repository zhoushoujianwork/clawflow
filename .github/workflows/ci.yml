name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base is needed to find the packages this PR changes.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Same entry as local runs: gofmt, vet, tests for changed packages only,
      # and CLI smoke. There is no full suite.
      - name: Go verification
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/verify.sh go

  native:
    name: Native macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build app without opening it
        run: make native
      - uses: actions/upload-artifact@v4
        with:
          name: ClawFlow-macOS
          path: macos/dist/ClawFlow.app

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build and typecheck web bundle
        run: scripts/verify.sh web
