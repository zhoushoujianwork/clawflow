name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The suite runs on isolated SQLite files and needs no database service.
      - name: Unit tests
        run: go test -v -race ./...

      # The one-time PostgreSQL importer is tested against an isolated schema in a
      # throwaway PostgreSQL service. The service exists only for this step.
      - name: Start PostgreSQL for importer tests
        run: |
          docker run -d --name import-fixture -e POSTGRES_USER=clawflow -e POSTGRES_PASSWORD=clawflow \
            -e POSTGRES_DB=clawflow_test -p 5432:5432 postgres:17
          for i in $(seq 1 30); do docker exec import-fixture pg_isready -U clawflow -d clawflow_test && break; sleep 2; done

      - name: Importer tests (PostgreSQL fixture)
        env:
          CLAWFLOW_TEST_DATABASE_DSN: postgres://clawflow:clawflow@localhost:5432/clawflow_test?sslmode=disable
        run: go test -v -race -count=1 -run 'Import|Cutover|Rollback|Verify' ./internal/store/...

      - name: CLI smoke tests
        run: |
          go build -o clawflow ./cmd/clawflow/
          ./clawflow --help
          ./clawflow version
          ./clawflow run --help
          ./clawflow db --help
          ./clawflow operators list
          # Hard fail if any embedded SKILL.md has bad frontmatter.
          ./clawflow operators validate
          ./clawflow repo --help
          ./clawflow issue --help
          ./clawflow label --help
          ./clawflow pr --help
          ./clawflow config --help
          ./clawflow status --help
          ./clawflow worktree --help
          ./clawflow pr-check --help
          ./clawflow update --help
          ./clawflow web --help
          ./clawflow controller --help
          ./clawflow dashboard --help
          ./clawflow worker join --help

  native:
    name: Native macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Headless native tests
        run: swift test --package-path macos
      - name: Build app without opening it
        run: make native
      - uses: actions/upload-artifact@v4
        with:
          name: ClawFlow-macOS
          path: macos/dist/ClawFlow.app

  web-render:
    name: Web render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web bundle
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.56.1

      - name: Install isolated headless Chromium
        # Step-level limit is above 3 x (60s lock wait + 150s attempt) plus
        # backoff, so a persistent hang fails this step instead of the job
        # being cancelled at its timeout.
        timeout-minutes: 12
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          # Runner background apt jobs can hold the dpkg lock; wait for it.
          wait_apt() {
            for _ in $(seq 1 12); do
              if ! sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; then
                return 0
              fi
              echo "Waiting for apt/dpkg lock to be released..."
              sleep 5
            done
            echo "::warning::apt/dpkg lock still held after 60s; continuing"
          }
          retry() {
            for attempt in 1 2 3; do
              wait_apt
              if timeout 150 "$@"; then
                return 0
              fi
              echo "::warning::Attempt $attempt/3 failed or timed out after 150s: $*"
              sleep 15
            done
            echo "::error::All 3 attempts failed: $*"
            return 1
          }
          retry npm install --prefix "$RUNNER_TEMP/render-tools" --no-package-lock playwright@1.56.1
          pw="$RUNNER_TEMP/render-tools/node_modules/.bin/playwright"
          if [ "$CACHE_HIT" = "true" ]; then
            echo "Playwright browser cache hit; skipping browser download"
            retry "$pw" install-deps chromium
          else
            echo "Playwright browser cache miss; downloading (cache is saved after the job succeeds)"
            retry "$pw" install --with-deps chromium
          fi

      - name: Run all render fixtures
        working-directory: web
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/render-tools/node_modules/playwright/index.mjs
        run: |
          for fixture in scripts/check-*-render.mjs; do
            echo "Running $fixture"
            node "$fixture"
          done
