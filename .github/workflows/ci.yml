name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clawflow
          POSTGRES_PASSWORD: clawflow
          POSTGRES_DB: clawflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clawflow -d clawflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web bundle
        run: cd web && pnpm install --frozen-lockfile && pnpm build

      - name: Unit tests
        env:
          CLAWFLOW_TEST_DATABASE_DSN: postgres://clawflow:clawflow@localhost:5432/clawflow_test?sslmode=disable
        run: go test -v -race ./...

      - name: CLI smoke tests
        run: |
          go build -o clawflow ./cmd/clawflow/
          ./clawflow --help
          ./clawflow version
          ./clawflow run --help
          ./clawflow db --help
          ./clawflow operators list
          # Hard fail if any embedded SKILL.md has bad frontmatter.
          ./clawflow operators validate
          ./clawflow repo --help
          ./clawflow issue --help
          ./clawflow label --help
          ./clawflow pr --help
          ./clawflow config --help
          ./clawflow status --help
          ./clawflow worktree --help
          ./clawflow pr-check --help
          ./clawflow update --help
          ./clawflow web --help
